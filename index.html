<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airplane Controller - OpenWii Web</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 24px; padding: 2rem; color: #111; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        #controller-ui { background-color: #f0f0f5; color: #111; touch-action: manipulation; }
        .btn-fire { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; border-radius: 50%; width: 120px; height: 120px; font-size: 1.5rem; font-weight: bold; box-shadow: 0 10px 20px rgba(255, 75, 43, 0.4); border: none; }
        .btn-fire:active { transform: scale(0.95); box-shadow: 0 5px 10px rgba(255, 75, 43, 0.4); }
    </style>
</head>
<body>

    <!-- HOST UI (Shows on Laptop) -->
    <div id="host-lobby" class="ui-layer" style="display: none;">
        <div class="glass-panel max-w-md w-full">
            <h1 class="text-4xl font-bold mb-2">Flight Simulator</h1>
            <p class="text-gray-700 mb-6">Scan to connect your phone as a steering wheel.</p>
            
            <div class="bg-white p-4 rounded-xl inline-block mb-4 shadow-sm">
                <div id="qrcode"></div>
            </div>
            
            <p id="connection-status" class="text-sm font-bold text-blue-600 animate-pulse">Waiting for controller...</p>
        </div>
    </div>

    <!-- The 3D Game Canvas -->
    <div id="canvas-container"></div>

    <!-- CONTROLLER UI (Shows on Phone) -->
    <div id="controller-ui" class="ui-layer" style="display: none;">
        <div id="controller-setup" class="flex flex-col items-center justify-center h-full px-6 text-center">
            <h2 class="text-3xl font-bold mb-4">Wii Controller</h2>
            <p class="mb-8 text-gray-600">Hold your phone like a steering wheel. We need permission to access your gyroscope to steer the plane.</p>
            <button id="btn-start-gyro" class="bg-blue-600 text-white px-8 py-4 rounded-full font-bold text-xl shadow-lg w-full max-w-xs">
                Connect & Start
            </button>
            <p id="ctrl-status" class="mt-4 text-sm font-bold text-gray-500"></p>
        </div>

        <div id="controller-active" class="flex-col items-center justify-center h-full w-full" style="display: none;">
            <div class="flex justify-between items-center w-full px-8 pt-8">
                <span class="text-sm font-bold text-green-500">● Connected</span>
                <button id="btn-recalibrate" class="text-blue-500 font-bold text-sm bg-blue-100 px-4 py-2 rounded-full shadow-sm">Recalibrate Center</button>
            </div>
            
            <!-- Added a debug box to show raw gyro data so we know if it's working -->
            <div id="gyro-debug" class="text-xs text-gray-500 font-mono mt-4 text-center px-4">Waiting for motion data...</div>

            <div class="flex-grow flex items-center justify-center w-full mt-10">
                <button id="btn-shoot" class="btn-fire">FIRE</button>
            </div>
            <p class="mt-auto pb-8 text-gray-400 text-sm">Tilt phone to steer the plane</p>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const hostPeerId = urlParams.get('host');

        // Added STUN servers to ensure connection works across different networks (4G vs WiFi)
        const peerConfig = {
            config: {
                'iceServers': [
                    { url: 'stun:stun.l.google.com:19302' },
                    { url: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };

        let peer;
        let conn;
        let baseBeta = 0;
        let baseGamma = 0;
        let isCalibrated = false;

        let shipPitch = 0;
        let shipRoll = 0;
        let isFiring = false;

        // Added variables to track gyro status
        let hasReceivedGyroData = false;
        let gyroDebugTimeout = null;

        if (mode === 'controller' && hostPeerId) {
            initController();
        } else {
            initHost();
        }

        // ==========================================
        // HOST LOGIC (LAPTOP / SCREEN)
        // ==========================================
        function initHost() {
            document.getElementById('host-lobby').style.display = 'flex';
            
            peer = new Peer(peerConfig); 

            peer.on('open', (id) => {
                console.log('Host ID:', id);
                const controllerUrl = `${window.location.origin}${window.location.pathname}?mode=controller&host=${id}`;
                
                new QRCode(document.getElementById("qrcode"), {
                    text: controllerUrl,
                    width: 200,
                    height: 200,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            });

            peer.on('connection', (connection) => {
                conn = connection;
                document.getElementById('connection-status').innerText = "Controller Connected! Starting flight...";
                document.getElementById('connection-status').className = "text-sm font-bold text-green-600";
                
                // Tell the controller we received the connection
                conn.on('open', () => {
                    conn.send({ type: 'handshake', status: 'ready' });
                });
                
                setTimeout(() => {
                    document.getElementById('host-lobby').style.display = 'none';
                    init3DGame();
                }, 1000);

                conn.on('data', (data) => {
                    if (data.type === 'orientation') {
                        shipPitch = data.pitch;
                        shipRoll = data.roll;
                    } else if (data.type === 'action' && data.action === 'fire') {
                        isFiring = true;
                    }
                });
            });

            peer.on('error', (err) => {
                console.error(err);
                document.getElementById('connection-status').innerText = "Connection Error. Refresh page.";
                document.getElementById('connection-status').className = "text-red-600 font-bold text-sm";
            });
        }

        // ==========================================
        // CONTROLLER LOGIC (PHONE)
        // ==========================================
        function initController() {
            document.getElementById('controller-ui').style.display = 'flex';
            const statusEl = document.getElementById('ctrl-status');
            const debugEl = document.getElementById('gyro-debug');
            
            document.getElementById('btn-start-gyro').addEventListener('click', async () => {
                statusEl.innerText = "Requesting permissions...";
                statusEl.className = "mt-4 text-sm font-bold text-blue-500";
                
                // CRITICAL: Requesting permission for iOS 13+ devices
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const permissionState = await DeviceOrientationEvent.requestPermission();
                        if (permissionState !== 'granted') {
                            alert('Gyroscope permission is required to play. Please allow it or check your device settings.');
                            statusEl.innerText = "Permission denied.";
                            statusEl.className = "mt-4 text-sm font-bold text-red-500";
                            return;
                        }
                    } catch (e) {
                        console.error("Error requesting DeviceOrientation:", e);
                        alert("Could not request gyroscope permission. Make sure you are on HTTPS.");
                        return;
                    }
                }

                statusEl.innerText = "Connecting to Laptop...";

                peer = new Peer(peerConfig);
                
                peer.on('open', () => {
                    conn = peer.connect(hostPeerId, { reliable: true });
                    
                    conn.on('open', () => {
                        activateControllerUI();
                    });

                    // Listen for handshake from host just in case local 'open' is slow
                    conn.on('data', (data) => {
                        if(data.type === 'handshake' && data.status === 'ready') {
                            activateControllerUI();
                        }
                    });

                    conn.on('error', (err) => {
                        statusEl.innerText = "Connection lost!";
                        statusEl.className = "mt-4 text-sm font-bold text-red-500";
                    });
                });

                peer.on('error', (err) => {
                    statusEl.innerText = "Failed to connect: " + err.type;
                    statusEl.className = "mt-4 text-sm font-bold text-red-500";
                });
            });

            function activateControllerUI() {
                document.getElementById('controller-setup').style.display = 'none';
                document.getElementById('controller-active').style.display = 'flex';
                
                // Add the listener for device orientation
                window.addEventListener('deviceorientation', handleOrientation);

                // Set a timeout to warn the user if no data is received
                gyroDebugTimeout = setTimeout(() => {
                    if (!hasReceivedGyroData) {
                        debugEl.innerHTML = "<span class='text-red-500 font-bold'>No motion detected!</span><br>Check if auto-rotate is on or if your browser blocks sensors.";
                    }
                }, 3000);
            }

            document.getElementById('btn-recalibrate').addEventListener('click', () => {
                isCalibrated = false; 
                debugEl.innerText = "Recalibrating...";
            });

            const btnShoot = document.getElementById('btn-shoot');
            btnShoot.addEventListener('touchstart', (e) => { e.preventDefault(); fireLaser(); });
            btnShoot.addEventListener('mousedown', fireLaser);

            function fireLaser() {
                if (conn && conn.open) {
                    conn.send({ type: 'action', action: 'fire' });
                }
            }

            function handleOrientation(event) {
                // If we get here and have valid data, the gyroscope is working!
                if (event.beta === null || event.gamma === null) return;
                
                if (!hasReceivedGyroData) {
                    hasReceivedGyroData = true;
                    clearTimeout(gyroDebugTimeout);
                }

                let beta = event.beta;   // Front/back tilt [-180, 180]
                let gamma = event.gamma; // Left/right tilt [-90, 90]
                
                // Update debug UI
                document.getElementById('gyro-debug').innerText = `Pitch: ${Math.round(beta)}° | Roll: ${Math.round(gamma)}°`;

                if (!conn || !conn.open) return;

                if (!isCalibrated) {
                    baseBeta = beta;
                    baseGamma = gamma;
                    isCalibrated = true;
                    return;
                }

                // Calculate difference from the center point
                let diffBeta = beta - baseBeta;
                let diffGamma = gamma - baseGamma;

                conn.send({
                    type: 'orientation',
                    pitch: diffBeta, 
                    roll: diffGamma  
                });
            }
        }

        // ==========================================
        // THREE.JS 3D GAME LOGIC (HOST ONLY)
        // ==========================================
        function init3DGame() {
            const container = document.getElementById('canvas-container');
            
            const scene = new THREE.Scene();
            // Sky Blue background and fog
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.003);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 20);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // Create Air/Speed Lines (White particles instead of stars)
            const particleGeo = new THREE.BufferGeometry();
            const particleCount = 600;
            const posArray = new Float32Array(particleCount * 3);
            for(let i=0; i<particleCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 200;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particleMat = new THREE.PointsMaterial({
                size: 0.8,
                color: 0xffffff,
                transparent: true,
                opacity: 0.6
            });
            const particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);

            // Create the Airplane
            const shipGroup = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.8, 1.2, 6, 16);
            bodyGeo.rotateX(Math.PI / 2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            shipGroup.add(body);
            
            // Wings
            const wingGeo = new THREE.BoxGeometry(8, 0.2, 2);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0xdd2222 }); 
            const wings = new THREE.Mesh(wingGeo, wingMat);
            wings.position.set(0, 0, 1);
            shipGroup.add(wings);

            // Tail
            const tailGeo = new THREE.BoxGeometry(0.2, 2, 1.5);
            const tail = new THREE.Mesh(tailGeo, wingMat);
            tail.position.set(0, 1, 2.5);
            shipGroup.add(tail);

            scene.add(shipGroup);

            const lasers = [];

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            function animate() {
                requestAnimationFrame(animate);

                // Simulate flying forward through the sky
                const positions = particles.geometry.attributes.position.array;
                for(let i=2; i<particleCount*3; i+=3) {
                    positions[i] += 2.0; 
                    if(positions[i] > 50) positions[i] = -150; 
                }
                particles.geometry.attributes.position.needsUpdate = true;

                // Move ship based on controller data
                const targetPitchZ = THREE.MathUtils.clamp(shipPitch / 30, -1.5, 1.5);
                const targetY = THREE.MathUtils.clamp(-shipPitch / 3, -10, 10);
                
                const targetRollZ = THREE.MathUtils.clamp(-shipRoll / 30, -1.5, 1.5);
                const targetX = THREE.MathUtils.clamp(shipRoll / 3, -15, 15);

                shipGroup.position.x += (targetX - shipGroup.position.x) * 0.1;
                shipGroup.position.y += (targetY - shipGroup.position.y) * 0.1;
                
                shipGroup.rotation.z += (targetRollZ - shipGroup.rotation.z) * 0.1;
                shipGroup.rotation.x += (targetPitchZ - shipGroup.rotation.x) * 0.1;

                // Shooting Logic
                if (isFiring) {
                    createLaser();
                    isFiring = false;
                }

                for (let i = lasers.length - 1; i >= 0; i--) {
                    lasers[i].position.z -= 4; 
                    if (lasers[i].position.z < -100) {
                        scene.remove(lasers[i]);
                        lasers.splice(i, 1);
                    }
                }

                // Camera follow
                camera.position.x = shipGroup.position.x * 0.5;
                camera.position.y = 5 + (shipGroup.position.y * 0.2);
                camera.lookAt(0, 0, -50);

                renderer.render(scene, camera);
            }

            function createLaser() {
                const laserGeo = new THREE.CylinderGeometry(0.1, 0.1, 2, 8);
                laserGeo.rotateX(Math.PI / 2);
                const laserMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 }); 
                
                const laserL = new THREE.Mesh(laserGeo, laserMat);
                laserL.position.copy(shipGroup.position);
                laserL.position.x -= 3; 
                
                const laserR = new THREE.Mesh(laserGeo, laserMat);
                laserR.position.copy(shipGroup.position);
                laserR.position.x += 3; 
                
                scene.add(laserL);
                scene.add(laserR);
                lasers.push(laserL, laserR);
            }

            animate();
        }
    </script>
</body>
</html>
