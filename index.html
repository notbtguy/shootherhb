<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <!-- Viewport settings to ensure the mobile controller looks good and doesn't zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alien Attack - OpenWii Web</title>
    
    <!-- Tailwind CSS for easy UI styling  -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js for High-End 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- PeerJS for Real-time Phone-to-Laptop Communication -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    
    <!-- QRCode.js to easily generate the connection link for the phone -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Glassmorphism styles for UI */
        .glass-panel { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px; padding: 2rem; color: white; text-align: center; }
        
        /* Mobile Controller Styles */
        #controller-ui { background-color: #f0f0f5; color: #111; touch-action: manipulation; }
        .btn-fire { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; border-radius: 50%; width: 120px; height: 120px; font-size: 1.5rem; font-weight: bold; box-shadow: 0 10px 20px rgba(255, 75, 43, 0.4); border: none; }
        .btn-fire:active { transform: scale(0.95); box-shadow: 0 5px 10px rgba(255, 75, 43, 0.4); }
    </style>
</head>
<body>

    <!-- ==========================================
         HOST UI (Shows on Laptop)
         ========================================== -->
    <div id="host-lobby" class="ui-layer" style="display: none;">
        <div class="glass-panel max-w-md w-full">
            <h1 class="text-4xl font-bold mb-2">Alien Attack</h1>
            <p class="text-gray-300 mb-6">Scan to connect your phone as a controller.</p>
            
            <div class="bg-white p-4 rounded-xl inline-block mb-4">
                <div id="qrcode"></div>
            </div>
            
            <p id="connection-status" class="text-sm font-semibold text-yellow-400 animate-pulse">Waiting for controller...</p>
            <p class="text-xs text-gray-400 mt-4">Make sure both devices are on the internet.</p>
        </div>
    </div>

    <!-- The 3D Game Canvas -->
    <div id="canvas-container"></div>

    <!-- ==========================================
         CONTROLLER UI (Shows on Phone)
         ========================================== -->
    <div id="controller-ui" class="ui-layer" style="display: none;">
        <div id="controller-setup" class="flex flex-col items-center justify-center h-full px-6 text-center">
            <h2 class="text-3xl font-bold mb-4">Wii Controller</h2>
            <p class="mb-8 text-gray-600">Hold your phone like a steering wheel. We need permission to access your gyroscope to steer the ship.</p>
            <button id="btn-start-gyro" class="bg-blue-600 text-white px-8 py-4 rounded-full font-bold text-xl shadow-lg w-full max-w-xs">
                Connect & Start
            </button>
            <p id="ctrl-status" class="mt-4 text-sm text-gray-500"></p>
        </div>

        <div id="controller-active" class="flex-col items-center justify-center h-full w-full" style="display: none;">
            <div class="flex justify-between items-center w-full px-8 pt-8">
                <span class="text-sm font-bold text-green-500">● Connected</span>
                <button id="btn-recalibrate" class="text-blue-500 font-bold text-sm bg-blue-100 px-4 py-2 rounded-full">Recalibrate Center</button>
            </div>
            <div class="flex-grow flex items-center justify-center w-full mt-20">
                <button id="btn-shoot" class="btn-fire">FIRE</button>
            </div>
            <p class="mt-auto pb-8 text-gray-400 text-sm">Tilt to steer</p>
        </div>
    </div>

    <!-- ==========================================
         JAVASCRIPT LOGIC
         ========================================== -->
    <script>
        // 1. Determine if we are the Host (Screen) or Controller (Phone)
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const hostPeerId = urlParams.get('host');

        // Global State
        let peer;
        let conn;
        let gameActive = false;

        // Controller State
        let baseBeta = 0;
        let baseGamma = 0;
        let isCalibrated = false;

        // Game State (Host)
        let shipPitch = 0;
        let shipRoll = 0;
        let isFiring = false;

        if (mode === 'controller' && hostPeerId) {
            initController();
        } else {
            initHost();
        }

        // ==========================================
        // HOST LOGIC (LAPTOP / SCREEN)
        // ==========================================
        function initHost() {
            document.getElementById('host-lobby').style.display = 'flex';
            
            // Initialize PeerJS for the Host
            peer = new Peer(); 

            peer.on('open', (id) => {
                console.log('Host ID:', id);
                // Create the controller URL
                const controllerUrl = `${window.location.origin}${window.location.pathname}?mode=controller&host=${id}`;
                
                // Generate QR Code
                new QRCode(document.getElementById("qrcode"), {
                    text: controllerUrl,
                    width: 200,
                    height: 200,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            });

            peer.on('connection', (connection) => {
                conn = connection;
                document.getElementById('connection-status').innerText = "Controller Connected! Starting game...";
                document.getElementById('connection-status').className = "text-sm font-semibold text-green-400";
                
                // Hide lobby and start 3D game after a brief pause
                setTimeout(() => {
                    document.getElementById('host-lobby').style.display = 'none';
                    init3DGame();
                }, 1500);

                // Listen for gyroscope/action data from the phone
                conn.on('data', (data) => {
                    if (data.type === 'orientation') {
                        // Smoothly interpolate the incoming tilt data
                        shipPitch = data.pitch;
                        shipRoll = data.roll;
                    } else if (data.type === 'action' && data.action === 'fire') {
                        isFiring = true;
                    }
                });
            });

            peer.on('error', (err) => {
                console.error(err);
                document.getElementById('connection-status').innerText = "Connection Error. Refresh page.";
                document.getElementById('connection-status').className = "text-red-500";
            });
        }

        // ==========================================
        // CONTROLLER LOGIC (PHONE)
        // ==========================================
        function initController() {
            document.getElementById('controller-ui').style.display = 'flex';
            const statusEl = document.getElementById('ctrl-status');
            
            document.getElementById('btn-start-gyro').addEventListener('click', async () => {
                statusEl.innerText = "Connecting to Host...";
                
                // iOS requires explicit permission for DeviceOrientation
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const permissionState = await DeviceOrientationEvent.requestPermission();
                        if (permissionState !== 'granted') {
                            alert('Gyroscope permission is required to play.');
                            return;
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }

                // Connect to Host via PeerJS
                peer = new Peer();
                peer.on('open', () => {
                    conn = peer.connect(hostPeerId);
                    
                    conn.on('open', () => {
                        document.getElementById('controller-setup').style.display = 'none';
                        document.getElementById('controller-active').style.display = 'flex';
                        
                        // Start sending gyro data
                        window.addEventListener('deviceorientation', handleOrientation);
                    });

                    conn.on('error', (err) => {
                        alert("Lost connection to host!");
                    });
                });
            });

            document.getElementById('btn-recalibrate').addEventListener('click', () => {
                isCalibrated = false; // Next reading will set a new zero point
            });

            // Handle Fire button
            const btnShoot = document.getElementById('btn-shoot');
            btnShoot.addEventListener('touchstart', (e) => { e.preventDefault(); fireLaser(); });
            btnShoot.addEventListener('mousedown', fireLaser);

            function fireLaser() {
                if (conn && conn.open) {
                    conn.send({ type: 'action', action: 'fire' });
                }
            }

            function handleOrientation(event) {
                if (!conn || !conn.open) return;

                let beta = event.beta;   // Front/back tilt [-180, 180]
                let gamma = event.gamma; // Left/right tilt [-90, 90]

                // Set calibration baseline on first read
                if (!isCalibrated) {
                    baseBeta = beta;
                    baseGamma = gamma;
                    isCalibrated = true;
                    return;
                }

                // Calculate difference from baseline
                let diffBeta = beta - baseBeta;
                let diffGamma = gamma - baseGamma;

                // Send normalized data to host
                conn.send({
                    type: 'orientation',
                    pitch: diffBeta, // Positive means leaning back
                    roll: diffGamma  // Positive means leaning right
                });
            }
        }

        // ==========================================
        // THREE.JS 3D GAME LOGIC (HOST ONLY)
        // ==========================================
        function init3DGame() {
            const container = document.getElementById('canvas-container');
            
            // Scene Setup
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050510, 0.002);

            // Camera Setup
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 20);

            // Renderer Setup
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Lighting to make it look "high-end"
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // 1. Create Space Background / Speed Lines (Particles)
            const particleGeo = new THREE.BufferGeometry();
            const particleCount = 1000;
            const posArray = new Float32Array(particleCount * 3);
            for(let i=0; i<particleCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 200;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particleMat = new THREE.PointsMaterial({
                size: 0.2,
                color: 0x88ccff,
                transparent: true,
                opacity: 0.8
            });
            const particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);

            // 2. Create the Planet (Like Saturn in your screenshot)
            const planetGroup = new THREE.Group();
            planetGroup.position.set(30, 10, -80);
            
            const sphereGeo = new THREE.SphereGeometry(15, 32, 32);
            const sphereMat = new THREE.MeshLambertMaterial({ color: 0xff8844 });
            const planet = new THREE.Mesh(sphereGeo, sphereMat);
            planetGroup.add(planet);

            const ringGeo = new THREE.TorusGeometry(22, 2, 16, 100);
            const ringMat = new THREE.MeshLambertMaterial({ color: 0xffccaa });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2.5;
            planetGroup.add(ring);
            scene.add(planetGroup);

            // 3. Create Glowing Nebulas (Like the pink/blue lights in screenshot)
            function createNebula(color, x, y, z) {
                const geo = new THREE.SphereGeometry(25, 32, 32);
                const mat = new THREE.MeshBasicMaterial({ 
                    color: color, transparent: true, opacity: 0.15, 
                    blending: THREE.AdditiveBlending, depthWrite: false
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                scene.add(mesh);
                return mesh;
            }
            createNebula(0xff00aa, -20, 5, -50); // Pinkish
            createNebula(0x00aaff, 20, -5, -60); // Blueish

            // 4. Create the Airplane / Spaceship
            const shipGroup = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.8, 1.2, 6, 16);
            bodyGeo.rotateX(Math.PI / 2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            shipGroup.add(body);
            
            // Wings
            const wingGeo = new THREE.BoxGeometry(8, 0.2, 2);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0xdd2222 }); // Red wings
            const wings = new THREE.Mesh(wingGeo, wingMat);
            wings.position.set(0, 0, 1);
            shipGroup.add(wings);

            // Tail
            const tailGeo = new THREE.BoxGeometry(0.2, 2, 1.5);
            const tail = new THREE.Mesh(tailGeo, wingMat);
            tail.position.set(0, 1, 2.5);
            shipGroup.add(tail);

            scene.add(shipGroup);

            // Lasers Array
            const lasers = [];

            // Window Resize Handler
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Animation Loop
            function animate() {
                requestAnimationFrame(animate);

                // Simulate flying forward (Move particles towards camera)
                const positions = particles.geometry.attributes.position.array;
                for(let i=2; i<particleCount*3; i+=3) {
                    positions[i] += 1.5; // Speed of stars
                    if(positions[i] > 50) positions[i] = -150; // Reset far away
                }
                particles.geometry.attributes.position.needsUpdate = true;

                // Gently rotate planet
                planetGroup.rotation.y += 0.002;
                planetGroup.rotation.z += 0.001;

                // --- CONTROLLER MOVEMENT LOGIC ---
                // We use lerp (linear interpolation) to make movement smooth
                
                // Map Pitch (-45 to 45 deg) to Y position (up/down) and X rotation
                const targetPitchZ = THREE.MathUtils.clamp(shipPitch / 30, -1.5, 1.5);
                const targetY = THREE.MathUtils.clamp(-shipPitch / 3, -10, 10);
                
                // Map Roll (-45 to 45 deg) to X position (left/right) and Z rotation
                const targetRollZ = THREE.MathUtils.clamp(-shipRoll / 30, -1.5, 1.5);
                const targetX = THREE.MathUtils.clamp(shipRoll / 3, -15, 15);

                // Smoothly move ship
                shipGroup.position.x += (targetX - shipGroup.position.x) * 0.1;
                shipGroup.position.y += (targetY - shipGroup.position.y) * 0.1;
                
                // Smoothly rotate ship (bank left/right, point up/down)
                shipGroup.rotation.z += (targetRollZ - shipGroup.rotation.z) * 0.1;
                shipGroup.rotation.x += (targetPitchZ - shipGroup.rotation.x) * 0.1;

                // --- SHOOTING LOGIC ---
                if (isFiring) {
                    createLaser();
                    isFiring = false;
                }

                // Update Lasers
                for (let i = lasers.length - 1; i >= 0; i--) {
                    lasers[i].position.z -= 3; // Laser speed
                    if (lasers[i].position.z < -100) {
                        scene.remove(lasers[i]);
                        lasers.splice(i, 1);
                    }
                }

                // Camera follow logic (gives a dynamic feel)
                camera.position.x = shipGroup.position.x * 0.5;
                camera.position.y = 5 + (shipGroup.position.y * 0.2);
                camera.lookAt(0, 0, -50);

                renderer.render(scene, camera);
            }

            // Helper to spawn lasers
            function createLaser() {
                const laserGeo = new THREE.CylinderGeometry(0.1, 0.1, 2, 8);
                laserGeo.rotateX(Math.PI / 2);
                const laserMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 }); // Green lasers
                
                // Left laser
                const laserL = new THREE.Mesh(laserGeo, laserMat);
                laserL.position.copy(shipGroup.position);
                laserL.position.x -= 3; // offset to left wing
                
                // Right laser
                const laserR = new THREE.Mesh(laserGeo, laserMat);
                laserR.position.copy(shipGroup.position);
                laserR.position.x += 3; // offset to right wing
                
                scene.add(laserL);
                scene.add(laserR);
                lasers.push(laserL, laserR);
            }

            // Start loop
            animate();
        } 
    </script>
</body>
</html>
